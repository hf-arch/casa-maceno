<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e6da"/>
      <stop offset="100%" stop-color="#dfd0ba"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#5c87a0" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>

  <g opacity="0.5">
    <path d="M80 60 Q130 30 170 75 Q120 90 80 60Z" fill="#7fa8bd"/>
    <path d="M1500 420 Q1550 400 1560 440 Q1525 450 1500 420Z" fill="#5c87a0"/>
  </g>

  <!-- notebook -->
