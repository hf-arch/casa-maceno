    <path d="M-260,-40 L260,-40 L260,90 L-260,90 Z" fill="#a05a38"/>
    <rect x="-230" y="-190" width="460" height="150" rx="14" fill="#4a3524"/>
    <rect x="-208" y="-170" width="416" height="112" rx="6" fill="#2a1b10"/>
    <polygon points="-30,-114 -30,-46 40,-80" fill="#d9a441"/>
    <path d="M-280,90 L280,90 L300,120 L-300,120 Z" fill="#8c6a4a"/>
  </g>

  <!-- fones de ouvido -->
