<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e9cd"/>
      <stop offset="100%" stop-color="#ecd6ab"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#9c3e22" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>

  <!-- folhas decorativas -->
  <g opacity="0.5">
    <path d="M60 40 Q110 10 150 55 Q100 70 60 40Z" fill="#5c87a0"/>
    <path d="M1500 60 Q1550 30 1560 80 Q1520 90 1500 60Z" fill="#7fa8bd"/>
  </g>

  <!-- pilha de cadernos -->
  <g transform="translate(1050,260)">
    <rect x="-140" y="60" width="300" height="60" rx="10" fill="#c1502e" transform="rotate(-4)"/>
    <rect x="-150" y="10" width="300" height="60" rx="10" fill="#7fa8bd" transform="rotate(3)"/>
    <rect x="-140" y="-40" width="300" height="60" rx="10" fill="#d9a441" transform="rotate(-2)"/>
  </g>

  <!-- livro aberto -->
  <g transform="translate(760,320)">
    <path d="M0,0 C-120,-30 -230,-20 -260,0 L-260,60 C-230,40 -120,50 0,80 Z" fill="#fffbf2" stroke="#e8d9be" stroke-width="3"/>
    <path d="M0,0 C120,-30 230,-20 260,0 L260,60 C230,40 120,50 0,80 Z" fill="#fbf3e8" stroke="#e8d9be" stroke-width="3"/>
    <path d="M-200,10 L-40,28 M-200,26 L-60,42 M-200,42 L-50,56" stroke="#bfa98d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200,10 L40,28 M200,26 L60,42 M200,42 L50,56" stroke="#bfa98d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-6" y="-30" width="12" height="90" fill="#a05a38"/>
  </g>

  <!-- lapis cruzados -->
  <g transform="translate(1180,140) rotate(28)">
    <rect x="-14" y="0" width="28" height="220" rx="6" fill="#d9a441"/>
    <polygon points="-14,0 14,0 0,-36" fill="#4a3524"/>
    <polygon points="-6,-24 6,-24 0,-36" fill="#2a1b10"/>
  </g>
  <g transform="translate(1260,150) rotate(-18)">
    <rect x="-14" y="0" width="28" height="200" rx="6" fill="#c1502e"/>
    <polygon points="-14,0 14,0 0,-34" fill="#4a3524"/>
    <polygon points="-6,-23 6,-23 0,-34" fill="#2a1b10"/>
  </g>
</svg>
